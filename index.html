
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Projetos Arduino | Juliano Hoffmann</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #0b1220;
    color: #f1f5f9;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

header {
    padding: 25px 8%;
    border-bottom: 1px solid #263247;
}

.logo {
    color: #38bdf8;
    font-size: 22px;
    font-weight: bold;
}

main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 40px 20px;
}

.icone {
    font-size: 100px;
    margin-bottom: 25px;
    filter: drop-shadow(0 0 20px #0284c7);
}

h1 {
    font-size: clamp(35px, 6vw, 60px);
    margin-bottom: 35px;
}

h1 span {
    color: #38bdf8;
}

.botao {
    display: inline-block;
    background: #0284c7;
    color: white;
    padding: 16px 32px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 17px;
    font-weight: bold;
    transition: .3s;
}

.botao:hover {
    background: #0ea5e9;
    transform: translateY(-4px);
    box-shadow: 0 8px 25px #0284c755;
}

footer {
    text-align: center;
    padding: 22px;
    border-top: 1px solid #263247;
    color: #64748b;
    font-size: 13px;
}
</style>
</head>

<body>

<header>
    <div class="logo">⚡ ARDUINO LAB</div>
</header>

<main>

    <div class="icone">🤖</div>

    <h1>
        Projetos <span>Arduino</span>
    </h1>

    <a class="botao"
       href="https://julianohoffmann.github.io/arduino/"
       target="_blank">
       Acessar projetos →
    </a>

</main>

<footer>
    © 2026 | Juliano Hoffmann
</footer>

</body>
</html>
